# Сайт Smart Centr на сервере. Отдельный проект docker compose: SBonus и другие контейнеры не затрагиваются.
# Наружу сайт отдаёт nginx (smartcentr.store → 127.0.0.1:18820).
name: smartcentr-site

services:
  site:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: smartcentr-site:latest
    container_name: smartcentr_site
    restart: unless-stopped
    env_file:
      - ../../.env.production
    ports:
      - "127.0.0.1:18820:3000"
    volumes:
      # Журнал вопросов из чата. Папка лежит ВНЕ /opt/smartcentr-site нарочно:
      # обновление сайта стирает эту папку целиком, и журнал пропадал бы при
      # каждой выкатке. ASSISTANT_LOG_DIR=/app/data в .env.production.
      - /opt/smartcentr-site-data:/app/data
    mem_limit: 768m
