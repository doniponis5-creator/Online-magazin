# Сайт Smart Centr на сервере. Отдельный проект docker compose: SBonus и другие контейнеры не затрагиваются.
# Наружу сайт отдаёт nginx (smartcentr.store → 127.0.0.1:18820).
name: smartcentr-site

services:
  site:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: smartcentr-site:latest
    container_name: smartcentr_site
    restart: unless-stopped
    env_file:
      - ../../.env.production
    ports:
      - "127.0.0.1:18820:3000"
    volumes:
      # Журнал вопросов из чата. Хранилище докера, а не папка на диске: докер
      # на сервере поставлен из snap и папки вне домашнего каталога подключить
      # не может — «read-only file system». Хранилище переживает и обновление
      # сайта, и пересборку образа. ASSISTANT_LOG_DIR=/app/data в .env.production.
      - site-data:/app/data
    mem_limit: 768m

volumes:
  site-data:
