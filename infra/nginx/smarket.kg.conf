# smarket.kg - Smart Centr shop (same container as whitefitpro.com). Added 2026-09-17
server {
    listen 80;
    listen [::]:80;
    server_name smarket.kg www.smarket.kg;
    include /etc/nginx/snippets/cloudflare-realip.conf;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://smarket.kg$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.smarket.kg;
    include /etc/nginx/snippets/cloudflare-realip.conf;
    ssl_certificate /etc/letsencrypt/live/smarket.kg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smarket.kg/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    return 301 https://smarket.kg$request_uri;
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name smarket.kg;
    include /etc/nginx/snippets/cloudflare-realip.conf;
    ssl_certificate /etc/letsencrypt/live/smarket.kg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smarket.kg/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    client_max_body_size 5m;
    location /_next/static/ {
        proxy_pass http://127.0.0.1:18820;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
        proxy_pass http://127.0.0.1:18820;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
